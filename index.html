<script>
const K='mi-espacio-v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const money=n=>n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?e.value.trim():''};
const def=()=>({tx:[],areas:[{id:uid(),name:'Casa',items:[]},{id:uid(),name:'Trabajo',items:[]}],notes:[],health:{},meals:[],goal:{kcal:2000,water:8}});
let S=null,view='hoy',open={},txType='gasto';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.areas)S=def();
const mig=()=>{S.events=S.events||[];S.habits=S.habits||[];S.goal=S.goal||{kcal:2000,water:8};S.goal.steps=S.goal.steps||8000;S.rec=S.rec||[];S.sav=S.sav||[];S.acc=S.acc||[];S.xfer=S.xfer||[];S.yld=S.yld||[];S.debts=S.debts||[];S.wk=S.wk||[];S.meds=S.meds||[];delete S.theme;delete S.accent;S.budget=S.budget||{};S.lastBk=S.lastBk||td();if(!S.ml){Object.values(S.health||{}).forEach(h=>{h.water=(Number(h.water)||0)*250});S.goal.water=(S.goal.water||8)*250;S.ml=1}};mig();
let tt;function flash(){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent='Guardado ✓';e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1100)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));flash()}catch(e){}};
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

 delSav:d=>{S.sav=S.sav.filter(g=>g.id!==d.i);save();render()},
 mood:d=>{H().mood=Number(d.v);save();render()},
 pinNote:d=>{const n=S.notes.find(x=>x.id===d.i);n.pin=n.pin?0:1;save();render()},
 togCk:d=>{const c=S.notes.find(x=>x.id===d.n).items.find(x=>x.id===d.i);c.d=!c.d;save();render()},
 delCk:d=>{const n=S.notes.find(x=>x.id===d.n);n.items=n.items.filter(x=>x.id!==d.i);save();render()},
 addCk:d=>{const t=val('ck-'+d.n);if(!t)return;const n=S.notes.find(x=>x.id===d.n);(n.items=n.items||[]).push({id:uid(),t,d:false});save();render()},
 ntag:d=>{NT=d.v;render()},
 setPin:()=>{const p=val('pn');if(!/^[0-9]{4}$/.test(p)){alert('Usa 4 números.');return}S.pin=hsh(p);save();render()},
 noPin:()=>{delete S.pin;save();render()},
 pin:d=>{if(d.v==='⌫')ent=ent.slice(0,-1);else if(ent.length<4)ent+=d.v;pd();if(ent.length===4){if(hsh(ent)===S.pin)$('lk').remove();else{ent='';const l=$('ld');l.classList.add('bad');setTimeout(()=>{l.classList.remove('bad');pd()},400)}}},
 forgot:()=>{if(confirm('Esto borra TODOS tus datos de la app. ¿Continuar?')){S=def();mig();save();$('lk').remove();render()}},
 exp:()=>{const T=String.fromCharCode(9),N=String.fromCharCode(10),l=fTx(1);clip(['Fecha','Tipo','Categoría','Cuenta','Nota','Monto'].join(T)+N+l.map(t=>[t.date,t.type,t.cat,(S.acc.find(a=>a.id===t.acc)||{}).name||'',(t.note||'').split(T).join(' '),t.amt].join(T)).join(N),'Tabla copiada. Pégala en Excel o Sheets.')},
 ty:d=>{txType=d.v;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));$('cg').innerHTML=chips('ct',txCats(),txCats()[0],CATI)},
 addTx:()=>{const a=parseFloat(val('am'));if(!(a>0))return;{const o={type:txType,amt:a,cat:val('ct'),note:val('nt'),acc:val('ac')};if(ed.tx){Object.assign(S.tx.find(x=>x.id===ed.tx)||{},o);ed.tx=''}else S.tx.push({id:uid(),...o,date:td()})}save();render()},
 delTx:d=>{S.tx=S.tx.filter(t=>t.id!==d.i);save();render()},
 newNote:()=>{S.notes.unshift({id:uid(),title:'',body:''});save();render()},
 delNote:d=>{if(!confirm('¿Eliminar esta nota?'))return;S.notes=S.notes.filter(n=>n.id!==d.i);save();render()},
 water:d=>{const h=H();h.water=Math.max(0,(Number(h.water)||0)+Number(d.v));save();render()},
 waterAdd:()=>{const a=parseFloat(val('wm'));if(!(a>0))return;const h=H();h.water=(Number(h.water)||0)+a;save();render()},
 addMeal:()=>{const n=val('mn');if(!n)return;S.meals.push({id:uid(),date:td(),name:n,kcal:parseInt(val('mk'))||0});save();render()},
 delMeal:d=>{S.meals=S.meals.filter(x=>x.id!==d.i);save();render()},
 copy:()=>{S.lastBk=td();save();const t=$('bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}},
 restore:()=>{const t=$('bk');t.removeAttribute('readonly');try{const o=JSON.parse(t.value);if(!o.areas)throw 0;S=o;mig();save();render()}catch(e){alert('El texto no es un respaldo válido.')}}
};
Object.keys(A).filter(k=>/^del/.test(k)).forEach(k=>{const f=A[k];A[k]=d=>{const s=JSON.stringify(S);f(d);undoTo(s)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const r=e.target.closest('.row');const b=r&&r.querySelector('button[data-act]');if(b)b.click()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note){const n=S.notes.find(x=>x.id===t.dataset.note);if(n){n[t.dataset.f]=t.value;save()}}live(t)});
document.addEventListener('change',e=>{const t=e.target;});
const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||!!document.querySelector('details[open]');
function patch(){const old=$('app'),tmp=document.createElement('main');tmp.innerHTML=TABS.find(t=>t[0]===view)[2]();renderNav();const a=[...old.children],b=[...tmp.children];if(a.length!==b.length){old.innerHTML=tmp.innerHTML;return}a.forEach((x,i)=>{if(!x.contains(document.activeElement))x.replaceWith(b[i])})}
function live(t){if(t.dataset.g){G=t.value;const e=$('gr');if(e)e.innerHTML=gsrch();return}if(t.dataset.f){F[t.dataset.f]=t.value;fil();return}const k=t.dataset.h?'h':t.dataset.goal?'goal':'';if(!k)return;const v=t.dataset[k];if(k==='h')H()[v]=t.value;else S.goal[v]=Number(t.value)||0;save();patch();if(k==='h'&&(v==='steps'||v==='water')){const s=t.closest('.stat').querySelector('.bar span');if(s)s.style.width=Math.min(100,(Number(t.value)||0)/(S.goal[v]||1)*100)+'%'}}
window.addEventListener('storage',e=>{if(e.key===K&&e.newValue){try{S=JSON.parse(e.newValue);mig();render()}catch(x){}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!typing())render()});
setInterval(()=>{if(typing()||view!=='hoy')renderNav();else render()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});lock();
render();
